# Kioxus 配置示例
# 复制此文件为 config.yaml，填入你自己的信息
#
# API Key 存放在 .env 文件中，格式：
#   YOUR_API_KEY=sk-xxxxxxxxxxxx
#
# 在下方 providers 中添加你自己的 LLM Provider

llm:
  # 默认使用的 provider
  default_provider: xiaomi

  providers:
    xiaomi:
      api_url: "https://token-plan-cn.xiaomimimo.com/v1/chat/completions"
      api_key_env: "XIAOMI_TOKEN_PLAN_API_KEY"  # .env 中的变量名
      model: "mimo-v2.5-pro"
      max_tokens: 2048
      temperature: 0.7

    minimax:
      api_url: "https://api.minimax.chat/v1/text/chatcompletion_v2"
      api_key_env: "MINIMAX_API_KEY"
      model: "MiniMax-Text-01"
      max_tokens: 2048
      temperature: 0.7

    # 添加你自己的 provider 示例：
    # openai:
    #   api_url: "https://api.openai.com/v1/chat/completions"
    #   api_key_env: "OPENAI_API_KEY"
    #   model: "gpt-4o"
    #   max_tokens: 4096
    #   temperature: 0.7

memory:
  max_entries: 1000
  compress_threshold: 500
